[project]
name = "axonvertex-secure-agent-studio-benchmark-runner"
version = "0.1.0"
description = "Benchmark and evaluation harness for AXONVERTEX Secure Agent Studio"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
